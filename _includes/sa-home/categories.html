<nav class="sa-categories" id="sa-categories" aria-label="주제별 기록" tabindex="-1">
  {% for symbol in include.symbols %}
    {% assign topic = include.topics | where: 'symbol', symbol | first %}
    {% if topic %}
      <a class="sa-category-card{% if symbol == 'flag' %} is-selected{% endif %}" href="#log-{{ topic.url | split: '/' | last | escape }}">
        <span class="sa-card-corners" aria-hidden="true"></span>
        {% include sa-home/icon.html name=symbol %}
        <span>{{ topic.title | replace: ' / ', ' · ' | escape }}</span>
      </a>
    {% endif %}
  {% endfor %}
</nav>
