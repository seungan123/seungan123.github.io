<div class="sa-world-backdrop" aria-hidden="true">
  <div class="sa-world-viewport">
    {% assign scene_parts = 'dawn,day,evening,night' | split: ',' %}
    {% for part in scene_parts %}
      <div class="sa-scene-frame" data-scene="{{ part }}">
        <img
          class="sa-world-distant"
          src="{{ '/assets/img/sa-home/scene-' | append: part | append: '.webp' | relative_url }}"
          alt=""
          width="1672"
          height="941"
          decoding="async"
          draggable="false"
        >
        <img
          class="sa-world-field"
          src="{{ '/assets/img/sa-home/scene-' | append: part | append: '.webp' | relative_url }}"
          alt=""
          width="1672"
          height="941"
          decoding="async"
          draggable="false"
        >
      </div>
    {% endfor %}
    {% include sa-home/scene.html %}
  </div>
</div>
