<header class="sa-header">
  <a class="sa-logo" href="{{ '/' | relative_url }}" aria-label="S_A 홈">S_A</a>
  <nav class="sa-navigation" aria-label="주요 메뉴">
    <a class="sa-nav-home" href="{{ '/' | relative_url }}" aria-current="page">홈</a>
    <a href="#sa-categories">카테고리</a>
    <a class="sa-nav-github" href="https://github.com/{{ site.github.username | escape }}" target="_blank" rel="noopener noreferrer">
      GitHub {% include sa-home/icon.html name="github" %}
    </a>
  </nav>
  <div class="sa-settings-wrap">
    <button class="sa-settings" type="button" aria-label="화면 설정" aria-controls="sa-settings-panel" aria-expanded="false" disabled>
      {% include sa-home/icon.html name="settings" %}
    </button>
    <div id="sa-settings-panel" class="sa-settings-panel" hidden>
      <fieldset>
        <legend>홈 디자인</legend>
        <div class="sa-version-options">
          <button type="button" data-home-choice="ver1" aria-pressed="true">ver1 <span>2D</span></button>
          <button type="button" data-home-choice="ver2" aria-pressed="false">ver2 <span>픽셀</span></button>
        </div>
      </fieldset>
      <fieldset>
        <legend>시간대 <span>서울 기준</span></legend>
        <div class="sa-time-options">
          <button type="button" data-time-choice="auto" aria-pressed="true">자동</button>
          <button type="button" data-time-choice="dawn" aria-pressed="false">새벽</button>
          <button type="button" data-time-choice="day" aria-pressed="false">낮</button>
          <button type="button" data-time-choice="evening" aria-pressed="false">저녁</button>
          <button type="button" data-time-choice="night" aria-pressed="false">밤</button>
        </div>
      </fieldset>
    </div>
  </div>
  <span id="sa-theme-status" class="sa-theme-status" role="status" aria-live="polite" aria-atomic="true"></span>
</header>
