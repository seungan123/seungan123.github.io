<header class="sa-header">
  <a class="sa-logo" href="{{ '/' | relative_url }}" aria-label="S_A 홈">S_A</a>
  <nav class="sa-navigation" aria-label="주요 메뉴">
    <a class="sa-nav-home" href="{{ '/' | relative_url }}" aria-current="page">홈</a>
    <a href="#sa-categories">카테고리</a>
    <a class="sa-nav-github" href="https://github.com/{{ site.github.username | escape }}" target="_blank" rel="noopener noreferrer">
      GitHub {% include sa-home/icon.html name="github" %}
    </a>
  </nav>
  <div class="sa-home-controls">
    <button class="sa-settings sa-version-toggle" type="button" aria-label="디자인 변경" disabled>
      {% include sa-home/icon.html name="settings" %}
    </button>
    <button class="sa-settings sa-time-toggle" type="button" aria-label="시간대 변경" disabled>
      <span data-time-icon="auto">{% include sa-home/icon.html name="clock" %}</span>
      <span data-time-icon="dawn">{% include sa-home/icon.html name="sunrise" %}</span>
      <span data-time-icon="day">{% include sa-home/icon.html name="sun" %}</span>
      <span data-time-icon="evening">{% include sa-home/icon.html name="sunset" %}</span>
      <span data-time-icon="night">{% include sa-home/icon.html name="moon" %}</span>
    </button>
  </div>
  <span id="sa-theme-status" class="sa-theme-status" role="status" aria-live="polite" aria-atomic="true"></span>
</header>
