<header id="topbar-wrapper" class="sa-header" aria-label="사이트 메뉴">
  <div id="topbar">
    <button id="sidebar-trigger" type="button" hidden aria-hidden="true" tabindex="-1">메뉴</button>
    <div id="topbar-title">
      <a class="sa-brand" href="{{ '/' | relative_url }}" aria-label="S_A 홈">
        <span class="sa-brand-reticle" aria-hidden="true"><span></span></span>
        <span>{{ site.title | escape }}</span>
      </a>
      <nav class="sa-top-nav" aria-label="주요 메뉴">
        <a class="sa-home-link" href="{{ '/' | relative_url }}"{% if page.layout == 'home' %} aria-current="page"{% endif %}>홈</a>
        <a href="{{ '/categories/' | relative_url }}"{% if page.url contains '/topics/' or page.url == '/categories/' %} aria-current="page"{% endif %}>카테고리 <i class="fas fa-angle-down" aria-hidden="true"></i></a>
        <a href="{{ '/#sa-posts' | relative_url }}">연구노트</a>
        <a class="sa-github" href="https://github.com/{{ site.github.username }}" target="_blank" rel="noopener noreferrer">깃허브 <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i></a>
      </nav>
    </div>
    <button type="button" id="sa-theme-preview" class="sa-theme-preview" aria-label="시간대 테마 미리보기" title="시간대 테마 미리보기"><i class="fas fa-gear" aria-hidden="true"></i></button>
    <button type="button" id="search-trigger" hidden aria-hidden="true" tabindex="-1" style="display:none!important"></button>
    <search id="search" aria-label="블로그 검색">
      <i class="fas fa-search" aria-hidden="true"></i>
      <input id="search-input" class="form-control" type="search" aria-label="게시글 검색어" autocomplete="off" placeholder="제목이나 키워드로 검색...">
    </search>
    <button type="button" id="search-cancel" class="btn" aria-label="검색 닫기">닫기</button>
  </div>
</header>
