<header class="shell site-bar">
  <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="S_A 홈">{{ site.title | escape }}</a>
  <nav aria-label="주요 메뉴">
    <a href="{{ '/' | relative_url }}"{% if page.layout == 'home' %} aria-current="page"{% endif %}>홈</a>
    <a href="{{ '/categories/' | relative_url }}"{% if page.url == '/categories/' %} aria-current="page"{% elsif page.layout == 'topic' or page.layout == 'category' %} aria-current="location"{% endif %}>카테고리</a>
    <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>소개</a>
    <a class="search-link" href="{{ '/search/' | relative_url }}"{% if page.url == '/search/' %} aria-current="page"{% endif %}>{% include sa-inner/icon.html name='search' %}검색</a>
  </nav>
</header>
