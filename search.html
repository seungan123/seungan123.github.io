---
layout: default
permalink: /search/
title: 검색
---
<section class="reading" id="search-page" data-index="{{ '/assets/js/data/search.json' | relative_url }}">
  <h1>검색</h1>
  <form class="search-form" action="{{ '/search/' | relative_url }}" role="search">
    <label class="sr-only" for="query">검색어</label>
    <input id="query" name="q" type="search" placeholder="제목, 본문, 카테고리 검색">
    <button>검색</button>
  </form>
  {% assign records = site.posts | where_exp: 'post', 'post.hidden != true' %}
  <p class="search-status" role="status"></p>
  {% include notebook/records.html records=records %}
</section>
<script defer src="{{ '/assets/js/notebook-search.js' | relative_url }}"></script>
