---
---
<!doctype html>
<html lang="{{ page.lang | default: site.lang | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    {% if page.robots %}<meta name="robots" content="{{ page.robots | escape }}">{% endif %}
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/notebook.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 이동</a>
    {% include topbar.html %}
    <main id="main" class="shell">{{ content }}</main>
    <footer class="shell site-foot">
      <span>© {{ site.time | date: '%Y' }} 신승안</span>
      <nav aria-label="외부 링크"><a href="https://github.com/{{ site.github.username | escape }}">GitHub</a><a href="{{ '/feed.xml' | relative_url }}">RSS</a></nav>
    </footer>
  </body>
</html>
