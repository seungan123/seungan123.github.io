---
layout: default
---
<section class="reading">
  <h1>태그</h1>
  {% if site.tags.size > 0 %}
    <ul class="topic-list">{% for tag in site.tags %}<li><a href="{{ tag[0] | slugify | url_encode | prepend: '/tags/' | append: '/' | relative_url }}">{{ tag[0] | escape }}</a></li>{% endfor %}</ul>
  {% else %}
    <p class="empty">등록된 태그가 없습니다.</p>
  {% endif %}
</section>
